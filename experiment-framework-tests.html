<!doctype html><html><body><pre id="out"></pre><script>window.state={inventory:[{id:'1',status:'Active',title:'A',category:'Bags',brand:'Coach',ask:75,daysListed:100},{id:'2',status:'Active',title:'B',category:'Bags',brand:'Coach',ask:80,daysListed:110},{id:'3',status:'Active',title:'C',category:'Shoes',brand:'Nike',ask:50,daysListed:200},{id:'4',status:'Active',title:'D',category:'Shoes',brand:'Nike',ask:55,daysListed:210}],optimizationQueue:[]};window.persist=()=>{};</script><script src="experiment-framework.js"></script><script>const r=[];function t(name,ok){r.push(`${ok?'PASS':'FAIL'} ${name}`)}const e=CommerceOSExperiments.createExperiment('title',{label:'Title test'});t('assignments created',e.assignments.length===4);t('both arms present',new Set(e.assignments.map(x=>x.arm)).size===2);const treat=e.assignments.find(x=>x.arm==='treatment');t('treatment intervention logs',CommerceOSExperiments.markIntervention(e.experiment.id,treat.itemId,{type:'title'})===true);const control=e.assignments.find(x=>x.arm==='control');t('control cannot be marked intervention',CommerceOSExperiments.markIntervention(e.experiment.id,control.itemId,{type:'title'})===false);state.inventory.find(x=>x.id===treat.itemId).status='Sold';state.inventory.find(x=>x.id===treat.itemId).priceSold=80;state.inventory.find(x=>x.id===treat.itemId).soldDate=new Date().toISOString();const s=CommerceOSExperiments.summarize(e.experiment.id);t('summary returns treatment and control',!!s.treatment&&!!s.control);t('sell-through lift finite',Number.isFinite(s.lift.sellThrough));document.getElementById('out').textContent=r.join('\n');</script></body></html>
