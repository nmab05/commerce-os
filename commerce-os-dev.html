<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Commerce OS — Integrated Development Runtime</title>
<style>
html,body{margin:0;height:100%;background:#f7f8fb;font-family:system-ui,-apple-system,sans-serif}.bar{height:42px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#111827;color:#fff;font-size:12px}.bar b{font-size:13px}.bar button{border:0;border-radius:7px;padding:6px 9px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.bar button.secondary{background:#475467}.status{margin-left:auto;color:#bbf7d0}.status.warn{color:#fde68a}iframe{border:0;width:100%;height:calc(100% - 42px);display:block;background:white}
</style>
</head>
<body>
<div class="bar"><b>Commerce OS Dev Runtime</b><span>Listing Optimization Intelligence enabled</span><button id="bulkBtn" disabled>Optimize top 25</button><button id="staleBtn" class="secondary" disabled>Stale inventory decisions</button><button id="econBtn" class="secondary" disabled>Cash recovery priorities</button><span id="status" class="status warn">Loading…</span></div>
<iframe id="app" src="index.html" title="Commerce OS"></iframe>
<script>
(function(){
  const frame=document.getElementById('app'),status=document.getElementById('status'),bulkBtn=document.getElementById('bulkBtn'),staleBtn=document.getElementById('staleBtn'),econBtn=document.getElementById('econBtn');
  function loadScript(doc,src){return new Promise((resolve,reject)=>{const s=doc.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('Could not load '+src));doc.body.appendChild(s)})}
  function ensurePanel(doc,id,title){let panel=doc.getElementById(id);if(!panel){panel=doc.createElement('div');panel.id=id;Object.assign(panel.style,{position:'fixed',right:'10px',top:'94px',zIndex:'2999',width:'min(460px,calc(100vw - 20px))',maxHeight:'68vh',overflow:'auto',background:'#fff',border:'1px solid #cbd5e1',borderRadius:'12px',padding:'12px',boxShadow:'0 10px 30px rgba(0,0,0,.18)',fontSize:'12px'});doc.body.appendChild(panel)}panel.innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px"><b>${title}</b><button onclick="this.parentElement.parentElement.remove()">×</button></div>`;return panel}
  function showBulkSummary(w,doc,result){const panel=ensurePanel(doc,'bulkOptimizerDevPanel','Bulk Listing Optimization');const top=(result.rows||[]).slice(0,10);panel.innerHTML+=`<div style="margin:7px 0;color:#475467">${result.rows.length} active item(s) scored • ${result.proposals} proposal(s) queued across ${result.items} item(s).</div>`+top.map((r,i)=>`<div style="padding:8px 0;border-top:1px solid #e5e7eb"><b>${i+1}. ${w.escapeHtml?w.escapeHtml(r.title):r.title}</b><div>Urgency ${r.urgency}/100 • Listing score ${r.optimizationScore}/100 • ${r.recommendationCount} recommendation(s)</div></div>`).join('')}
  function queueDecision(w,d){if(d.action==='hold')return false;const item=(w.state.inventory||[]).find(x=>String(x.id)===String(d.itemId));if(!item||typeof w.proposal!=='function')return false;const p=w.CommerceOSStaleInventory.proposalFor(d,item);const duplicate=(w.state.optimizationQueue||[]).some(q=>q.itemId===item.id&&q.type===`stale-${d.action}`&&q.status!=='rejected');if(duplicate)return false;w.state.optimizationQueue.unshift(w.proposal(item,`stale-${d.action}`,d.priority,p.field,p.current,p.proposed,`Stale inventory decision: ${d.reasons.join('; ')}`));return true}
  function showStaleSummary(w,doc){const rows=w.CommerceOSStaleInventory.rank(w.state.inventory||[],w.state),panel=ensurePanel(doc,'staleInventoryDevPanel','Stale Inventory Decisions');const counts=rows.reduce((a,r)=>(a[r.action]=(a[r.action]||0)+1,a),{});panel.innerHTML+=`<div style="margin:7px 0;color:#475467">${rows.length} active item(s) evaluated • ${Object.entries(counts).map(([k,v])=>`${k}: ${v}`).join(' • ')}</div>`+rows.slice(0,15).map((r,i)=>`<div style="padding:8px 0;border-top:1px solid #e5e7eb"><b>${i+1}. ${w.escapeHtml?w.escapeHtml(r.title):r.title}</b><div><b>${r.action.toUpperCase()}</b> • ${r.priority} • score ${r.score}/100</div><div style="color:#667085">${r.reasons.join(' • ')||'No intervention needed'}</div><button data-id="${r.itemId}" style="margin-top:5px;padding:5px 8px">Queue recommendation</button></div>`).join('');[...panel.querySelectorAll('button[data-id]')].forEach(btn=>btn.onclick=()=>{const d=rows.find(r=>String(r.itemId)===btn.dataset.id);if(!d)return;if(queueDecision(w,d)){if(typeof w.persist==='function')w.persist();if(typeof w.renderOptimizationQueue==='function')w.renderOptimizationQueue();btn.textContent='Queued';btn.disabled=true}else{btn.textContent=d.action==='hold'?'No change needed':'Already queued';btn.disabled=true}})}
  function showEconomics(w,doc){const rows=w.CommerceOSPortfolioEconomics.rank(),panel=ensurePanel(doc,'portfolioEconomicsDevPanel','Cash Recovery Priorities');const top=rows.slice(0,20),cash=top.reduce((s,r)=>s+r.expectedCash,0),margin=top.reduce((s,r)=>s+r.expectedGrossMargin,0),model=w.CommerceOSPortfolioEconomics.calibrationModel?.();const modelText=model?`${model.soldCount} sold records • ${model.confidence} calibration • median ${model.overall.medianDays||'N/A'} days to sale`:'Heuristic only';panel.innerHTML+=`<div style="margin:7px 0;color:#475467"><b>Sell-through model:</b> ${modelText}</div><div style="margin:7px 0;color:#475467">Top ${top.length} expected cash: <b>$${cash.toFixed(0)}</b> • expected gross margin: <b>$${margin.toFixed(0)}</b></div><button id="queueEconTop" style="margin:4px 0 8px;padding:6px 9px">Queue top 25 priorities</button>`+top.map((r,i)=>`<div style="padding:8px 0;border-top:1px solid #e5e7eb"><b>${i+1}. ${w.escapeHtml?w.escapeHtml(r.title):r.title}</b><div>Priority ${r.priorityScore}/100 • Expected cash $${r.expectedCash.toFixed(2)} • Sale probability ${(r.probability*100).toFixed(0)}%</div><div style="color:#667085">Market value $${r.marketValue.toFixed(2)} • Expected margin $${r.expectedGrossMargin.toFixed(2)} • ${r.ageDays} days listed • ${r.probabilitySource}</div></div>`).join('');panel.querySelector('#queueEconTop').onclick=()=>{const result=w.CommerceOSPortfolioEconomics.queueTop(25);panel.querySelector('#queueEconTop').textContent=`Queued ${result.queued} priorities`;panel.querySelector('#queueEconTop').disabled=true}}
  frame.addEventListener('load',async()=>{
    try{
      const w=frame.contentWindow,doc=frame.contentDocument;
      await loadScript(doc,'listing-optimizer.js');
      await loadScript(doc,'listing-optimizer-integration.js');
      await loadScript(doc,'listing-optimizer-bulk.js');
      await loadScript(doc,'stale-inventory-engine.js');
      await loadScript(doc,'sellthrough-calibration.js');
      await loadScript(doc,'portfolio-economics.js');
      await loadScript(doc,'commerce-os-dev-selfcheck.js');
      if(!w.CommerceOSListingOptimizer||!w.CommerceOSListingOptimizerIntegration||!w.CommerceOSBulkListingOptimizer||!w.CommerceOSStaleInventory||!w.CommerceOSSellthroughCalibration||!w.CommerceOSPortfolioEconomics)throw new Error('Optimizer modules did not initialize.');
      const check=typeof w.runCommerceOSDevSelfCheck==='function'?w.runCommerceOSDevSelfCheck():{ok:false,tests:[]};
      if(!check.ok){const failed=(check.tests||[]).filter(t=>!t.ok).map(t=>t.name).join(', ');throw new Error('Self-check failed: '+failed)}
      bulkBtn.disabled=false;staleBtn.disabled=false;econBtn.disabled=false;
      bulkBtn.onclick=()=>{const result=w.CommerceOSBulkListingOptimizer.run(25);showBulkSummary(w,doc,result)};
      staleBtn.onclick=()=>showStaleSummary(w,doc);
      econBtn.onclick=()=>showEconomics(w,doc);
      status.textContent='Integrated runtime ready • self-check passed';status.classList.remove('warn');
      const badge=doc.createElement('div');badge.textContent='Listing Intelligence DEV ✓';Object.assign(badge.style,{position:'fixed',right:'10px',top:'62px',zIndex:'3000',padding:'6px 9px',borderRadius:'999px',background:'#111827',color:'#fff',fontSize:'10px',fontWeight:'700',boxShadow:'0 3px 10px rgba(0,0,0,.16)'});badge.title=(check.tests||[]).map(t=>`${t.ok?'PASS':'FAIL'} — ${t.name}`).join('\n');doc.body.appendChild(badge);
    }catch(e){status.textContent='Integration error: '+e.message;status.classList.add('warn')}
  });
})();
</script>
</body>
</html>
