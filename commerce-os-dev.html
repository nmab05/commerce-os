<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Commerce OS — Integrated Development Runtime</title>
<style>
html,body{margin:0;height:100%;background:#f7f8fb;font-family:system-ui,-apple-system,sans-serif}.bar{height:42px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#111827;color:#fff;font-size:12px}.bar b{font-size:13px}.bar button{border:0;border-radius:7px;padding:6px 9px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.bar button.secondary{background:#475467}.status{margin-left:auto;color:#bbf7d0}.status.warn{color:#fde68a}iframe{border:0;width:100%;height:calc(100% - 42px);display:block;background:white}
</style>
</head>
<body>
<div class="bar"><b>Commerce OS Dev Runtime</b><button id="autoBtn" disabled>Run Autopilot</button><button id="bulkBtn" class="secondary" disabled>Optimize top 25</button><button id="staleBtn" class="secondary" disabled>Stale decisions</button><button id="econBtn" class="secondary" disabled>Cash priorities</button><button id="learnBtn" class="secondary" disabled>Learning</button><button id="expBtn" class="secondary" disabled>Experiments</button><span id="status" class="status warn">Loading…</span></div>
<iframe id="app" src="index.html" title="Commerce OS"></iframe>
<script>
(function(){
  const frame=document.getElementById('app'),status=document.getElementById('status'),autoBtn=document.getElementById('autoBtn'),bulkBtn=document.getElementById('bulkBtn'),staleBtn=document.getElementById('staleBtn'),econBtn=document.getElementById('econBtn'),learnBtn=document.getElementById('learnBtn'),expBtn=document.getElementById('expBtn');
  function loadScript(doc,src){return new Promise((resolve,reject)=>{const s=doc.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('Could not load '+src));doc.body.appendChild(s)})}
  function ensurePanel(doc,id,title){let panel=doc.getElementById(id);if(!panel){panel=doc.createElement('div');panel.id=id;Object.assign(panel.style,{position:'fixed',right:'10px',top:'94px',zIndex:'2999',width:'min(520px,calc(100vw - 20px))',maxHeight:'74vh',overflow:'auto',background:'#fff',border:'1px solid #cbd5e1',borderRadius:'12px',padding:'12px',boxShadow:'0 10px 30px rgba(0,0,0,.18)',fontSize:'12px'});doc.body.appendChild(panel)}panel.innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px"><b>${title}</b><button onclick="this.parentElement.parentElement.remove()">×</button></div>`;return panel}
  function seedExperiments(w){return ['title','price','relist','crosslist','photo'].map(a=>w.CommerceOSExperimentApproval.autoCreateForPending(a,6)).filter(Boolean)}
  function showAutopilot(w,doc){const ranked=w.CommerceOSAutopilot.rank(),panel=ensurePanel(doc,'autopilotPanel','Autopilot Daily Action Queue');const top=ranked.slice(0,25),cash=top.reduce((s,r)=>s+r.expectedCash,0);panel.innerHTML+=`<div style="margin:8px 0;color:#475467">${ranked.length} active item(s) scored • top 25 expected cash <b>$${cash.toFixed(0)}</b>. One primary action per item. Consequential actions still require approval.</div><button id="queueAuto" style="padding:7px 10px;margin-bottom:8px">Queue top 25 for approval</button>`+top.map((r,i)=>`<div style="padding:9px 0;border-top:1px solid #e5e7eb"><b>${i+1}. ${w.escapeHtml?w.escapeHtml(r.title):r.title}</b><div><b>${r.action.toUpperCase()}</b> • impact ${r.impactScore}/100 • ${r.priority}</div><div>Expected cash $${r.expectedCash.toFixed(2)} • sale probability ${(r.probability*100).toFixed(0)}% • listing ${r.listingScore}/100</div><div style="color:#667085">${r.reasons.slice(0,4).join(' • ')||'No intervention needed'}</div></div>`).join('');panel.querySelector('#queueAuto').onclick=()=>{const result=w.CommerceOSAutopilot.queue(25);const created=seedExperiments(w);panel.querySelector('#queueAuto').textContent=`Queued ${result.queued} action(s)${created.length?` • ${created.length} experiment(s) seeded`:''}`;panel.querySelector('#queueAuto').disabled=true}}
  function showBulkSummary(w,doc,result){const created=seedExperiments(w),panel=ensurePanel(doc,'bulkOptimizerDevPanel','Bulk Listing Optimization');const top=(result.rows||[]).slice(0,10);panel.innerHTML+=`<div style="margin:7px 0;color:#475467">${result.rows.length} active item(s) scored • ${result.proposals} proposal(s) queued.${created.length?` • ${created.length} experiment(s) auto-created.`:''}</div>`+top.map((r,i)=>`<div style="padding:8px 0;border-top:1px solid #e5e7eb"><b>${i+1}. ${w.escapeHtml?w.escapeHtml(r.title):r.title}</b><div>Urgency ${r.urgency}/100 • Listing score ${r.optimizationScore}/100</div></div>`).join('')}
  function queueDecision(w,d){if(d.action==='hold')return false;const item=(w.state.inventory||[]).find(x=>String(x.id)===String(d.itemId));if(!item||typeof w.proposal!=='function')return false;const p=w.CommerceOSStaleInventory.proposalFor(d,item);const duplicate=(w.state.optimizationQueue||[]).some(q=>q.itemId===item.id&&q.type===`stale-${d.action}`&&q.status!=='rejected');if(duplicate)return false;w.state.optimizationQueue.unshift(w.proposal(item,`stale-${d.action}`,d.priority,p.field,p.current,p.proposed,`Stale inventory decision: ${d.reasons.join('; ')}`));seedExperiments(w);return true}
  function showStaleSummary(w,doc){const rows=w.CommerceOSDecisionPolicy.rank(w.state.inventory||[],w.state),panel=ensurePanel(doc,'staleInventoryDevPanel','Stale Inventory Decisions');const counts=rows.reduce((a,r)=>(a[r.action]=(a[r.action]||0)+1,a),{});panel.innerHTML+=`<div style="margin:7px 0;color:#475467">${rows.length} active item(s) evaluated • ${Object.entries(counts).map(([k,v])=>`${k}: ${v}`).join(' • ')}</div>`+rows.slice(0,15).map((r,i)=>`<div style="padding:8px 0;border-top:1px solid #e5e7eb"><b>${i+1}. ${w.escapeHtml?w.escapeHtml(r.title):r.title}</b><div><b>${r.action.toUpperCase()}</b> • ${r.priority} • score ${r.score}/100</div><div style="color:#667085">${r.reasons.join(' • ')||'No intervention needed'}</div>${r.effectEvidence?`<div style="margin-top:4px;color:#475467">Experiment-informed • ${r.effectEvidence.confidence} confidence</div>`:`<div style="margin-top:4px;color:#98a2b3">Base-rule recommendation</div>`}<button data-id="${r.itemId}" style="margin-top:5px;padding:5px 8px">Queue recommendation</button></div>`).join('');[...panel.querySelectorAll('button[data-id]')].forEach(btn=>btn.onclick=()=>{const d=rows.find(r=>String(r.itemId)===btn.dataset.id);if(!d)return;if(queueDecision(w,d)){if(typeof w.persist==='function')w.persist();if(typeof w.renderOptimizationQueue==='function')w.renderOptimizationQueue();btn.textContent='Queued';btn.disabled=true}else{btn.textContent=d.action==='hold'?'No change needed':'Already queued';btn.disabled=true}})}
  function showEconomics(w,doc){const rows=w.CommerceOSPortfolioEconomics.rank(),panel=ensurePanel(doc,'portfolioEconomicsDevPanel','Cash Recovery Priorities');const top=rows.slice(0,20),cash=top.reduce((s,r)=>s+r.expectedCash,0),margin=top.reduce((s,r)=>s+r.expectedGrossMargin,0),model=w.CommerceOSPortfolioEconomics.calibrationModel?.();const modelText=model?`${model.soldCount} sold records • ${model.confidence} calibration • median ${model.overall.medianDays||'N/A'} days to sale`:'Heuristic only';panel.innerHTML+=`<div style="margin:7px 0;color:#475467"><b>Sell-through model:</b> ${modelText}</div><div style="margin:7px 0;color:#475467">Top ${top.length} expected cash: <b>$${cash.toFixed(0)}</b> • expected gross margin: <b>$${margin.toFixed(0)}</b></div>`+top.map((r,i)=>`<div style="padding:8px 0;border-top:1px solid #e5e7eb"><b>${i+1}. ${w.escapeHtml?w.escapeHtml(r.title):r.title}</b><div>Priority ${r.priorityScore}/100 • Expected cash $${r.expectedCash.toFixed(2)} • Sale probability ${(r.probability*100).toFixed(0)}%</div></div>`).join('')}
  function showLearning(w,doc){const s=w.CommerceOSPerformanceLearning.status(),m=s.metrics,t=s.tuning,e=w.CommerceOSActionEffects.getModel(),panel=ensurePanel(doc,'performanceLearningPanel','Performance Learning Diagnostics');const fmt=v=>v==null?'N/A':Number(v).toFixed(2);const effects=Object.entries(e.global||{}).sort((a,b)=>(b[1].score||0)-(a[1].score||0));panel.innerHTML+=`<div style="margin:8px 0;color:#475467">Forecasts <b>${s.forecasts}</b> • outcomes <b>${s.outcomes}</b> • paired <b>${m.samples}</b></div><div>Price MAE $${fmt(m.priceMae)} • Cash MAE $${fmt(m.cashMae)} • Margin MAE $${fmt(m.marginMae)}</div><div style="margin-top:8px">Tuning: cash ${fmt(t.cashWeight)} • margin ${fmt(t.marginWeight)} • opportunity ${fmt(t.opportunityWeight)} • probability ${fmt(t.probabilityScale)}</div><div style="margin-top:8px;border-top:1px solid #e5e7eb;padding-top:8px"><b>Measured action effects</b>${effects.length?effects.map(([a,v])=>`<div>${a}: ${(v.score*100).toFixed(1)} • ${v.sample||0} sample(s)</div>`).join(''):'<div>No closed experiments yet.</div>'}</div>`}
  function showExperiments(w,doc){const panel=ensurePanel(doc,'experimentPanel','Optimization Experiments');const experiments=w.CommerceOSExperiments.list(),links=w.state.experimentProposalLinks||[];panel.innerHTML+=`<div style="margin:8px 0;color:#475467">${links.length} proposal-to-experiment link(s). Controls are protected from treatment.</div><div style="display:flex;gap:6px;flex-wrap:wrap"><button data-new="title">Test title</button><button data-new="price">Test price</button><button data-new="relist">Test relist</button><button data-new="crosslist">Test cross-list</button><button data-new="photo">Test photos</button></div>`+(experiments.length?experiments.map(e=>{const s=e.summary,l=s.lift,assign=(w.state.experimentAssignments||[]).filter(a=>a.experimentId===e.id),treated=assign.filter(a=>a.interventionAt).length;return `<div style="padding:9px 0;border-top:1px solid #e5e7eb"><b>${e.label}</b> • ${e.status}<div>Treatment ${s.treatment.n} / Control ${s.control.n} • interventions ${treated}</div><div>Sell-through lift ${(l.sellThrough*100).toFixed(1)} pts • faster ${l.daysToSale.toFixed(1)} days • margin lift $${l.margin.toFixed(2)}</div><button data-close="${e.id}" ${e.status==='closed'?'disabled':''}>${e.status==='closed'?'Closed':'Close experiment'}</button></div>`}).join(''):'<div style="margin-top:10px">No experiments yet.</div>');[...panel.querySelectorAll('button[data-new]')].forEach(b=>b.onclick=()=>{const result=w.CommerceOSExperiments.createExperiment(b.dataset.new,{label:`${b.dataset.new} optimization test`});b.textContent=`Created ${result.assignments.length}`;b.disabled=true});[...panel.querySelectorAll('button[data-close]')].forEach(b=>b.onclick=()=>{w.CommerceOSExperiments.closeExperiment(b.dataset.close);w.CommerceOSActionEffects.train();showExperiments(w,doc)})}
  frame.addEventListener('load',async()=>{try{const w=frame.contentWindow,doc=frame.contentDocument;for(const src of ['state-compatibility.js','listing-optimizer.js','listing-optimizer-integration.js','listing-optimizer-bulk.js','stale-inventory-engine.js','sellthrough-calibration.js','performance-learning.js','portfolio-economics.js','experiment-framework.js','experiment-approval-integration.js','action-effect-learning.js','decision-policy-learning.js','autopilot-engine.js','commerce-os-dev-selfcheck.js','premerge-selfcheck.js'])await loadScript(doc,src);if(!w.CommerceOSAutopilot)throw new Error('Autopilot did not initialize.');w.CommerceOSStateCompatibility.migrate();w.CommerceOSExperimentApproval.install();w.CommerceOSActionEffects.getModel();const devCheck=typeof w.runCommerceOSDevSelfCheck==='function'?w.runCommerceOSDevSelfCheck():{ok:false,tests:[]};if(!devCheck.ok){const failed=(devCheck.tests||[]).filter(t=>!t.ok).map(t=>t.name).join(', ');throw new Error('Dev self-check failed: '+failed)}const premergeCheck=typeof w.runCommerceOSPremergeSelfCheck==='function'?w.runCommerceOSPremergeSelfCheck():{ok:false,tests:[]};if(!premergeCheck.ok){const failed=(premergeCheck.tests||[]).filter(t=>!t.ok).map(t=>t.name).join(', ');throw new Error('Pre-merge self-check failed: '+failed)}autoBtn.disabled=false;bulkBtn.disabled=false;staleBtn.disabled=false;econBtn.disabled=false;learnBtn.disabled=false;expBtn.disabled=false;autoBtn.onclick=()=>showAutopilot(w,doc);bulkBtn.onclick=()=>showBulkSummary(w,doc,w.CommerceOSBulkListingOptimizer.run(25));staleBtn.onclick=()=>showStaleSummary(w,doc);econBtn.onclick=()=>showEconomics(w,doc);learnBtn.onclick=()=>showLearning(w,doc);expBtn.onclick=()=>showExperiments(w,doc);status.textContent=`Autopilot runtime ready • ${premergeCheck.passed} pre-merge checks passed`;status.classList.remove('warn');const badge=doc.createElement('div');badge.textContent='Commerce OS AUTOPILOT DEV ✓';Object.assign(badge.style,{position:'fixed',right:'10px',top:'62px',zIndex:'3000',padding:'6px 9px',borderRadius:'999px',background:'#111827',color:'#fff',fontSize:'10px',fontWeight:'700',boxShadow:'0 3px 10px rgba(0,0,0,.16)'});badge.title=(premergeCheck.tests||[]).map(t=>`${t.ok?'PASS':'FAIL'} — ${t.name}`).join('\n');doc.body.appendChild(badge)}catch(e){status.textContent='Integration error: '+e.message;status.classList.add('warn')}});
})();
</script>
</body>
</html>
