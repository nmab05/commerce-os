<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Commerce OS — Integrated Development Runtime</title>
<style>
html,body{margin:0;height:100%;background:#f7f8fb;font-family:system-ui,-apple-system,sans-serif}.bar{height:42px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#111827;color:#fff;font-size:12px}.bar b{font-size:13px}.status{margin-left:auto;color:#bbf7d0}.status.warn{color:#fde68a}iframe{border:0;width:100%;height:calc(100% - 42px);display:block;background:white}
</style>
</head>
<body>
<div class="bar"><b>Commerce OS Dev Runtime</b><span>Listing Optimization Intelligence enabled</span><span id="status" class="status warn">Loading…</span></div>
<iframe id="app" src="index.html" title="Commerce OS"></iframe>
<script>
(function(){
  const frame=document.getElementById('app'),status=document.getElementById('status');
  function loadScript(doc,src){return new Promise((resolve,reject)=>{const s=doc.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('Could not load '+src));doc.body.appendChild(s)})}
  frame.addEventListener('load',async()=>{
    try{
      const w=frame.contentWindow,doc=frame.contentDocument;
      await loadScript(doc,'listing-optimizer.js');
      await loadScript(doc,'listing-optimizer-integration.js');
      await loadScript(doc,'commerce-os-dev-selfcheck.js');
      if(!w.CommerceOSListingOptimizer||!w.CommerceOSListingOptimizerIntegration)throw new Error('Optimizer modules did not initialize.');
      const check=typeof w.runCommerceOSDevSelfCheck==='function'?w.runCommerceOSDevSelfCheck():{ok:false,tests:[]};
      if(!check.ok){const failed=(check.tests||[]).filter(t=>!t.ok).map(t=>t.name).join(', ');throw new Error('Self-check failed: '+failed)}
      status.textContent='Integrated runtime ready • self-check passed';status.classList.remove('warn');
      const badge=doc.createElement('div');
      badge.textContent='Listing Intelligence DEV ✓';
      Object.assign(badge.style,{position:'fixed',right:'10px',top:'62px',zIndex:'3000',padding:'6px 9px',borderRadius:'999px',background:'#111827',color:'#fff',fontSize:'10px',fontWeight:'700',boxShadow:'0 3px 10px rgba(0,0,0,.16)'});
      badge.title=(check.tests||[]).map(t=>`${t.ok?'PASS':'FAIL'} — ${t.name}`).join('\n');
      doc.body.appendChild(badge);
    }catch(e){status.textContent='Integration error: '+e.message;status.classList.add('warn')}
  });
})();
</script>
</body>
</html>
