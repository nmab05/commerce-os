<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Commerce OS</title>
<style>
html,body{margin:0;height:100%;background:#f7f8fb;font-family:system-ui,-apple-system,sans-serif}.bar{height:46px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#111827;color:#fff;font-size:12px}.bar b{font-size:14px}.bar button{border:0;border-radius:8px;padding:7px 10px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.bar button.secondary{background:#475467}.bar button:disabled{opacity:.5;cursor:not-allowed}.status{margin-left:auto;color:#bbf7d0}.status.warn{color:#fde68a}iframe{border:0;width:100%;height:calc(100% - 46px);display:block;background:white}
</style>
</head>
<body>
<div class="bar"><b>Commerce OS</b><button id="runBtn" disabled>Run Autopilot</button><button id="queueBtn" class="secondary" disabled>Queue top 25</button><span id="status" class="status warn">Loading…</span></div>
<iframe id="app" src="index.html" title="Commerce OS"></iframe>
<script>
(function(){
  const frame=document.getElementById('app'),status=document.getElementById('status'),runBtn=document.getElementById('runBtn'),queueBtn=document.getElementById('queueBtn');
  const scripts=['state-compatibility.js','listing-optimizer.js','listing-optimizer-integration.js','listing-optimizer-bulk.js','stale-inventory-engine.js','sellthrough-calibration.js','performance-learning.js','portfolio-economics.js','experiment-framework.js','experiment-approval-integration.js','action-effect-learning.js','decision-policy-learning.js','autopilot-engine.js','premerge-selfcheck.js'];
  function loadScript(doc,src){return new Promise((resolve,reject)=>{const s=doc.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('Could not load '+src));doc.body.appendChild(s)})}
  function panel(doc){let p=doc.getElementById('commerceOSAutopilotPanel');if(!p){p=doc.createElement('div');p.id='commerceOSAutopilotPanel';Object.assign(p.style,{position:'fixed',right:'10px',top:'70px',zIndex:'4000',width:'min(560px,calc(100vw - 20px))',maxHeight:'78vh',overflow:'auto',background:'#fff',border:'1px solid #cbd5e1',borderRadius:'12px',padding:'12px',boxShadow:'0 10px 30px rgba(0,0,0,.18)',fontSize:'12px'});doc.body.appendChild(p)}return p}
  function show(w,doc){const rows=w.CommerceOSAutopilot.rank(),top=rows.slice(0,25),p=panel(doc),cash=top.reduce((s,r)=>s+(r.expectedCash||0),0);p.innerHTML='<div style="display:flex;justify-content:space-between;gap:8px"><b>Autopilot Daily Action Queue</b><button onclick="this.parentElement.parentElement.remove()">×</button></div>'+`<div style="margin:8px 0;color:#475467">${rows.length} active item(s) scored • top 25 expected cash <b>$${cash.toFixed(0)}</b>. Recommendations require approval.</div>`+top.map((r,i)=>`<div style="padding:9px 0;border-top:1px solid #e5e7eb"><b>${i+1}. ${(w.escapeHtml?w.escapeHtml(r.title):r.title)||'Untitled'}</b><div><b>${String(r.action||'hold').toUpperCase()}</b> • impact ${r.impactScore}/100 • ${r.priority}</div><div>Expected cash $${Number(r.expectedCash||0).toFixed(2)} • sale probability ${(Number(r.probability||0)*100).toFixed(0)}%</div><div style="color:#667085">${(r.reasons||[]).slice(0,4).join(' • ')}</div></div>`).join('')}
  frame.addEventListener('load',async()=>{try{const w=frame.contentWindow,doc=frame.contentDocument;for(const src of scripts)await loadScript(doc,src);w.CommerceOSStateCompatibility.migrate();if(w.CommerceOSExperimentApproval?.install)w.CommerceOSExperimentApproval.install();if(w.CommerceOSActionEffects?.getModel)w.CommerceOSActionEffects.getModel();const check=w.runCommerceOSPremergeSelfCheck();if(!check.ok){const failed=check.tests.filter(t=>!t.ok).map(t=>t.name).join(', ');throw new Error('Self-check failed: '+failed)}runBtn.disabled=false;queueBtn.disabled=false;runBtn.onclick=()=>show(w,doc);queueBtn.onclick=()=>{const result=w.CommerceOSAutopilot.queue(25);show(w,doc);queueBtn.textContent=`Queued ${result.queued}`};status.textContent='Ready • approval-first Autopilot';status.classList.remove('warn')}catch(e){status.textContent='Startup error: '+e.message;status.classList.add('warn')}});
})();
</script>
</body>
</html>
