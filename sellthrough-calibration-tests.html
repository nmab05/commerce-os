<!doctype html><meta charset="utf-8"><title>Sell-through calibration tests</title><pre id="out"></pre><script src="sellthrough-calibration.js"></script><script>
const sold=[];for(let i=0;i<30;i++)sold.push({id:'S'+i,status:'Sold',priceSold:60+i%5,ask:70,listedDate:'2026-01-01',soldDate:`2026-0${1+(i%5)}-15`,category:i<20?'Bags':'Shoes',brand:i<15?'Coach':'Other',soldPlatform:i%2?'eBay':'Poshmark'});
const model=CommerceOSSellthroughCalibration.train(sold);const item={id:'A',status:'Active',ask:70,daysListed:40,category:'Bags',brand:'Coach',marketplaces:['eBay','Poshmark']};const e=CommerceOSSellthroughCalibration.empiricalProbability(item,model,90);const b=CommerceOSSellthroughCalibration.blend(item,.5,model);const tests=[['sold count',model.soldCount===30],['medium confidence',model.confidence==='medium'],['category stats',model.category.bags.n===20],['empirical bounded',e>0&&e<1],['blend bounded',b.probability>0&&b.probability<1],['blend source',/blended/.test(b.source))];document.getElementById('out').textContent=tests.map(([n,p])=>`${p?'PASS':'FAIL'} ${n}`).join('\n');
</script>
