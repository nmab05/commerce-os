name: Commerce OS Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/listing-optimization-intelligence]

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Commerce OS release gate
        run: node release-gate.js
