<!doctype html><meta charset="utf-8"><title>Action Effect Learning Tests</title><pre id="out"></pre><script>window.state={inventory:[{id:'1',category:'Bags',brand:'Coach',ask:80,status:'Sold'}],experiments:[{id:'e1',action:'price',status:'closed',result:{treatment:{n:10},control:{n:10},lift:{sellThrough:.2,daysToSale:8,price:4,margin:12}}}],experimentAssignments:[{experimentId:'e1',itemId:'1',arm:'treatment'}]};window.persist=()=>{};</script><script src="action-effect-learning.js"></script><script>const m=CommerceOSActionEffects.train(),e=CommerceOSActionEffects.estimate(state.inventory[0],'price');const tests=[['model trained',m.experiments===1],['positive effect',e.score>0],['category evidence exists',!!m.byCategory.bags.price],['bounded effect',e.score<=.5&&e.score>=-.5]];out.textContent=tests.map(([n,p])=>`${p?'PASS':'FAIL'} — ${n}`).join('\n');</script>
