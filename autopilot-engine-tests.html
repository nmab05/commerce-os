<!doctype html><meta charset="utf-8"><title>Autopilot tests</title><pre id="o"></pre><script>window.state={inventory:[],compResearch:{},photoResearch:{},optimizationQueue:[]};window.proposal=(item,type,priority,field,current,proposed,reason)=>({itemId:item.id,type,priority,field,current,proposed,reason,status:'pending'});</script><script src="listing-optimizer.js"></script><script src="stale-inventory-engine.js"></script><script>window.CommerceOSDecisionPolicy={choose:(item,state)=>{const d=CommerceOSStaleInventory.decide(item,state);return item.id==='A'?{...d,action:'cross-list',baseAction:d.action,effectEvidence:{score:.2,confidence:'high',sample:20},reasons:[...(d.reasons||[]),'experiment evidence favors cross-list']}:{...d,effectEvidence:null,baseAction:d.action}}};window.CommerceOSPortfolioEconomics={scoreItem:item=>({priorityScore:item.id==='A'?80:40,expectedCash:item.id==='A'?70:25,probability:.5,probabilitySource:'heuristic'})};</script><script src="autopilot-engine.js"></script><script>
