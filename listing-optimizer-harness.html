<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commerce OS Listing Optimizer Harness</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;max-width:920px;margin:30px auto;padding:0 16px;background:#f7f8fb;color:#111827}.card{background:white;border:1px solid #d8dee9;border-radius:14px;padding:16px;margin:12px 0}textarea{width:100%;min-height:220px}button{padding:10px 14px;border:0;border-radius:9px;background:#2563eb;color:white;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f8fafc;padding:12px;border-radius:10px}</style></head>
<body>
<h1>Commerce OS — Listing Optimization Intelligence</h1>
<p>Development harness for approval-first title, description, pricing and research recommendations.</p>
<div class="card"><h2>Item JSON</h2><textarea id="item">{"id":"DEMO-1","title":"Coach brown bag","brand":"Coach","category":"Women's Bags","condition":"Pre-Owned - Good","primaryColor":"Brown","tags":"leather shoulder purse","description":"","ask":55,"vendooMeta":{"sku":"A01-01"}}</textarea></div>
<div class="card"><h2>Saved market research JSON</h2><textarea id="research">{"recommendedPrice":72,"confidence":"High","rationale":"Three relevant sold comps support a low-$70s list price.","comps":[{"type":"sold","price":68},{"type":"sold","price":74},{"type":"sold","price":79},{"type":"active","price":85}]}</textarea></div>
<button onclick="run()">Run optimizer</button>
<div class="card"><h2>Optimization package</h2><pre id="out">Run the optimizer to see the approval package.</pre></div>
<script src="listing-optimizer.js"></script><script>function run(){try{const item=JSON.parse(document.getElementById('item').value),research=JSON.parse(document.getElementById('research').value);document.getElementById('out').textContent=JSON.stringify(CommerceOSListingOptimizer.optimize(item,research),null,2)}catch(e){document.getElementById('out').textContent='Error: '+e.message}}</script>
</body></html>
